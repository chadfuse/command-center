name = "auto-poster"
main = "src/index.js"
compatibility_date = "2024-08-15"

[vars]
TEXT_API_URL = "https://generativelanguage.googleapis.com/v1beta/models"
TEXT_MODEL = "gemini-2.5-flash"
FALLBACK_TEXT_MODEL = "gemini-2.0-flash"
IMAGE_MODEL = "imagen-3.0-generate-002"
FALLBACK_IMAGE_MODEL = "imagen-3.0-fast-generate-001"
CRON_NICHE = "AI and WordPress development"
CRON_TOPICS = "[\"How to use AI to speed up WordPress development\", \"Beaver Builder AI tips and workflows\", \"Top AI tools for WordPress developers\", \"How to improve Core Web Vitals\", \"Building custom AI features inside WordPress\", \"Best AI plugins for Beaver Builder\", \"WordPress security best practices\", \"Automating WordPress content with AI\", \"How to use AI for WordPress code generation\", \"AI-powered design systems for WordPress\", \"Modern web development frameworks\", \"Beaver Builder and AI: a complete guide\", \"AI automation for web developers\", \"Conversion-focused landing page design\", \"WordPress and AI chatbots: how to build one\"]"
RSS_FEED_URLS = "[\"https://wptavern.com/feed\", \"https://wordpress.org/news/feed/\", \"https://torquemag.io/feed/\", \"https://beaverbuilder.com/feed/\"]"
NOTIFICATION_EMAIL = "chadderylsia@gmail.com"
FROM_EMAIL = "hello@chadsia.com"

[triggers]
crons = ["0 8 * * 1,4", "0 10 * * *", "0 18 * * *"]

[[kv_namespaces]]
binding = "POSTED_TOPICS"
id = "9259199c666d414098f9617f625b8a83"

[ai]
binding = "AI"
